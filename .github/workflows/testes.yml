name: Testes Flask e MySQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integracao:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 33317:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements-lock.txt
      - name: Preparar banco descartável
        run: |
          python configurar_ambiente.py --host 127.0.0.1 --porta 33317
          # A conexão do runner chega ao contêiner pela rede Docker, não por localhost.
          # Somente as contas descartáveis deste job aceitam esse acesso.
          sed -i "s/@'localhost'/@'%'/g" sql/06_usuarios.local.sql
          for arquivo in 01_ddl.sql 02_carga.sql 04_views.sql 05_triggers.sql 06_seguranca.sql 06_usuarios.local.sql 11_cadastro_publico.sql 12_integridade.sql; do
            mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 33317 -u root < "sql/$arquivo"
          done
      - name: Teste de fumaça
        run: python app/teste_fumaca.py
      - name: Regressões de integridade e segurança
        env:
          ALLOW_TEST_DATABASE: '1'
        run: python -m unittest discover -s tests -v
      - name: Verificar arquivos privados
        run: |
          python -c "import subprocess; nomes=subprocess.check_output(['git','ls-files','-z']).decode().split('\0'); assert not any(n=='.env' or n.endswith('.local.sql') or (n.startswith('.vscode/') and n.endswith('.zip')) for n in nomes)"
      - name: Backup e restauração
        run: |
          printf '[client]\nhost=127.0.0.1\nport=33317\nuser=root\n' > backup/backup.cnf
          bash backup/backup.sh
          bash backup/restaurar_teste.sh
