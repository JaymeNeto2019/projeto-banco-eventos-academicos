{% extends 'base.html' %}
{% block titulo %}Criar usuário | Agenda Acadêmica{% endblock %}
{% block conteudo %}
<div class="page-heading"><div class="eyebrow">ADMINISTRAÇÃO</div><h1>Novo usuário</h1><p>Somente administradores podem conceder perfis de gestão.</p></div>
<form class="f" method="post" action="{{ url_for('usuario_novo') }}">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label for="login">Login (3 a 60 caracteres)</label>
  <input name="login" id="login" minlength="3" maxlength="60" pattern="[A-Za-z0-9_.-]+" value="{{ request.form.get('login', '') }}" required>
  <label for="senha">Senha (8 ou mais caracteres)</label>
  <input name="senha" id="senha" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
  <label for="confirmar">Confirmar senha</label>
  <input name="confirmar" id="confirmar" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
  <label for="perfil_novo">Permissão da conta</label>
  <select name="perfil" id="perfil_novo">{% for p in perfis %}<option value="{{ p }}" {% if request.form.get('perfil', 'CONSULTA') == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select>
  <p class="info">As senhas são armazenadas como hash bcrypt. Não informe a senha do MySQL aqui.</p>
  <button class="btn" type="submit">Criar usuário</button>
</form>
{% endblock %}
